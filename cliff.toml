# git-cliff configuration: generates CHANGELOG.md from the commit messages.
# Keep a Changelog format, written for players: only feat, fix, refactor and perf commits are
# listed. docs, test, chore, style, build, ci and non-conventional commits are left out, except
# commits marked "!" (they break existing worlds), which always get their own section first.
# Documentation: https://git-cliff.org/docs/configuration
#
#   git-cliff -o CHANGELOG.md                         # everything, "Unreleased" section included
#   git-cliff --tag v0.1.0-alpha.1 -o CHANGELOG.md    # when preparing a release (scripts/dev release prepare)
#   git-cliff --latest --strip all                    # notes of the latest version only
# The compare links need the repository: scripts/dev passes it with --offline --github-repo
# <owner/repo>, read from the git remote (without it, the links are left empty).

[changelog]
header = """
# Changelog

All notable changes to this project are recorded in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project follows [Semantic Versioning](https://semver.org/). While the version starts with 0, the mod is not stable: a minor version may break existing worlds, a patch version never does.

"""
body = """
{% if version -%}
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
    ## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim }}
    {% for commit in commits %}
        - {% if commit.scope %}*{{ commit.scope }}*: {% endif %}\
          {{ commit.message | split(pat="\n") | first | replace(from="📝", to="") | trim | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = """
{% for release in releases -%}
    {% if release.version and release.previous and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /compare/{{ release.previous.version }}...{{ release.version }}
    {% elif release.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
                /releases/tag/{{ release.version }}
    {% elif release.previous and release.previous.version -%}
        [Unreleased]: https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}\
            /compare/{{ release.previous.version }}...HEAD
    {% endif -%}
{% endfor %}
<!-- Generated by git-cliff from the commit messages: do not edit by hand. -->
"""
trim = true

[git]
conventional_commits = true
# Non-conventional commits (two old commits, merge commits) are left out.
filter_unconventional = true
split_commits = false
# The first matching parser wins. The number orders the sections (Keep a Changelog order) and is
# removed when displayed.
commit_parsers = [
    # A commit marked "!" (or with a "BREAKING CHANGE:" footer) breaks existing worlds, whatever its type.
    { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaks existing worlds" },
    { message = "^feat", group = "<!-- 1 -->Added" },
    { message = "^(refactor|perf)", group = "<!-- 2 -->Changed" },
    { message = "^fix", group = "<!-- 3 -->Fixed" },
    { message = ".*", skip = true },
]
# A breaking change stays in the changelog even when its type is left out (docs!, chore!...).
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+(-(alpha|beta)\\.[0-9]+)?$"
topo_order = false
sort_commits = "oldest"
