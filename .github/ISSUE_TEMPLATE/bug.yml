name: Bug report
description: Something does not work as expected in the game or in the tooling.
title: "[Bug] "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. **Security issues must not be reported here**: use the private report described in the security policy (Security tab).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a new world if possible. Devices placed, cables plugged, commands typed.
      placeholder: |
        1. Place a PC tower and an internet box.
        2. Plug them together with an Ethernet cable.
        3. ...
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: Shown in the Mods screen, or in the jar name.
      placeholder: 0.1.0-alpha.1
    validations:
      required: true
  - type: input
    id: game-versions
    attributes:
      label: Minecraft and NeoForge versions
      placeholder: Minecraft 26.3, NeoForge 26.3.0.103
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Single player
        - Multiplayer, dedicated server
        - Multiplayer, LAN world
        - Development environment (runClient, runServer, game tests)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines of logs/latest.log, or the crash report. Long files can be attached instead.
      render: shell
  - type: checkboxes
    id: world
    attributes:
      label: World
      options:
        - label: The bug damaged or corrupted an existing world.
